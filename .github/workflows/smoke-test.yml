name: Smoke Test

on:
  # Run after CI passes on main (ensures lint/test pass before smoke tests).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  # Run on PRs that touch parser or test code, or that bump dependencies.
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "smoke-baseline.json"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/smoke-test.yml"

  # Triggered by manasight-corpus when a new corpus release is published.
  repository_dispatch:
    types: [corpus-release]

  # Weekly on Sundays at 06:00 UTC.
  schedule:
    - cron: "0 6 * * 0"

  # Manual trigger for ad-hoc runs.
  workflow_dispatch:

permissions: {}

# Only one smoke test per ref at a time.
concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Real-log smoke test
    runs-on: ubuntu-latest

    # Skip if the triggering CI workflow failed (workflow_run trigger).
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    # Read-only: the baseline-update step below commits and opens its pull
    # request using its own repository secret (git remote set-url + GH_TOKEN
    # override), never the default GITHUB_TOKEN, so this job needs no write
    # scope on it -- including on the pull_request trigger, which now runs
    # third-party build.rs/proc-macro code from whatever a dependency bump
    # pulls in and must not carry a token that can write repo contents.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not persist the read-only GITHUB_TOKEN: checkout stores it as an
          # http.extraheader Authorization header, which git sends in place of
          # the credential in the remote URL, so the baseline push below would
          # authenticate as github-actions[bot] and get a 403. Nothing else in
          # this job runs an authenticated git command.
          persist-credentials: false

      # The test data is read with a dedicated read-only secret. Pull requests
      # from forks and Dependabot do not receive it and skip. Any other event
      # fails without it, so a missing secret cannot pass as a green run.
      - name: Check secret availability
        id: secrets-check
        env:
          HAS_TOKEN: ${{ secrets.TEST_DATA_TOKEN != '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::TEST_DATA_TOKEN not available; skipping (expected for fork and Dependabot pull requests)"
          else
            echo "::error::TEST_DATA_TOKEN is not set"
            exit 1
          fi

      - name: Install Rust toolchain
        if: steps.secrets-check.outputs.skip == 'false'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      # Compile before the token or the test data are used, so dependency build
      # scripts and proc macros never run next to either.
      - name: Build tests
        if: steps.secrets-check.outputs.skip == 'false'
        run: cargo test --no-run

      - name: Resolve corpus release tag
        if: steps.secrets-check.outputs.skip == 'false'
        id: corpus-tag
        env:
          GH_TOKEN: ${{ secrets.TEST_DATA_TOKEN }}
        run: |
          TAG=$(gh release view --repo manasight/manasight-corpus --json tagName --jq '.tagName')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Corpus release tag: $TAG"

      # Never cached and never uploaded: anyone who can open a pull request can
      # read this repository's caches, and any signed-in user can download its
      # artifacts. The download takes seconds.
      - name: Download corpus
        if: steps.secrets-check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.TEST_DATA_TOKEN }}
          CORPUS_TAG: ${{ steps.corpus-tag.outputs.tag }}
        run: |
          gh release download "$CORPUS_TAG" \
            --repo manasight/manasight-corpus \
            --pattern "*.tar.gz" \
            --output /tmp/smoke-corpus.tar.gz

      # Extract corpus and decompress log files.
      # The tarball contains corpus/*.log.gz — extract and gunzip to get .log files.
      - name: Extract corpus
        if: steps.secrets-check.outputs.skip == 'false'
        run: |
          mkdir -p /tmp/test-logs
          tar -xzf /tmp/smoke-corpus.tar.gz -C /tmp/test-logs
          gunzip /tmp/test-logs/corpus/*.log.gz
          echo "Corpus files: $(find /tmp/test-logs/corpus -name '*.log' | wc -l)"

      # Run smoke tests with ratchet comparison against baseline.
      - name: Run smoke tests
        if: steps.secrets-check.outputs.skip == 'false'
        id: smoke
        env:
          MANASIGHT_TEST_LOGS: /tmp/test-logs/corpus
          CORPUS_TAG: ${{ steps.corpus-tag.outputs.tag }}
        run: |
          set +e
          cargo test smoke_test_real_logs > /tmp/smoke-raw.txt 2>&1
          SMOKE_EXIT=$?
          set -e

          # A panic message can quote the input being parsed, so raw test output
          # never reaches the log, the summary or the steps below. Only lines
          # that match the report's exact formats (names and counts) are kept.
          cat > /tmp/smoke-allow.txt <<'ALLOW'
          ^$
          ^=== [A-Za-z -]+ ===$
          ^File: [^ ]+ \([0-9]+ entries\)$
          ^File: [^ ]+ -- READ ERROR \(unreadable file\)$
          ^ +[A-Za-z_][A-Za-z0-9_ ]*: +[0-9]+( claimed, +[0-9]+ panics| GSMs, +[0-9]+ total)?$
          ^  (Event type breakdown|GSM turn_info|GSM annotations|GSM timers|GSM diff_deleted_instance_ids|DeckCollection payloads):$
          ^    \(none\)$
          ^Ratchet(: all counts match baseline\.| improvements \([0-9]+\):| REGRESSIONS \([0-9]+\):)$
          ^  \[[-+]\] [^ ]+: [0-9]+ -> [0-9]+ \([-+][0-9]+\)$
          ^test [A-Za-z0-9_:]+ \.\.\. [A-Za-z]+$
          ^test result:
          ^thread '[^']+' \([0-9]+\) panicked at [^ ]+:[0-9]+:[0-9]+:$
          ^assertion `left == right` failed: [A-Za-z ]+ detected -- see report above$
          ^ratchet regressions detected \([0-9]+ regression\(s\)\) -- see report above\.
          ^error: test failed
          ALLOW
          grep -E -f /tmp/smoke-allow.txt /tmp/smoke-raw.txt > /tmp/smoke-output.txt || true
          rm -f /tmp/smoke-raw.txt
          cat /tmp/smoke-output.txt

          echo "exit_code=$SMOKE_EXIT" >> "$GITHUB_OUTPUT"

          # Parse ratchet output for job summary.
          # Extract everything after "Ratchet" line for the summary.
          if grep -q "Ratchet" /tmp/smoke-output.txt; then
            echo "has_ratchet=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ratchet=false" >> "$GITHUB_OUTPUT"
          fi

          exit $SMOKE_EXIT

      # Write job summary with ratchet results.
      - name: Write job summary
        if: always() && steps.smoke.outcome != 'skipped'
        run: |
          {
            echo "## Smoke Test Results"
            echo ""

            if [ "${{ steps.smoke.outcome }}" = "success" ]; then
              echo "**Status:** PASS"
            else
              echo "**Status:** FAIL"
            fi
            echo ""

            # Build a comparison table from the smoke output.
            echo "### Per-File Summary"
            echo ""
            echo "| File | Entries | Claimed | Unclaimed | Ratchet |"
            echo "|------|---------|---------|-----------|---------|"

            # Parse each file's stats from the smoke output using POSIX awk
            # to avoid fd-sharing issues with nested read loops.
            # Note: uses only POSIX awk features (no gawk-specific match()).
            awk '
              /^File: .+ \([0-9]+ entries\)/ {
                # Strip "File: " prefix and " (NNN entries)" suffix.
                s = $0
                sub(/^File: /, "", s)
                sub(/ \([0-9]+ entries\)$/, "", s)
                fname = s
                # Extract entry count from between parens.
                s = $0
                sub(/.*\(/, "", s)
                sub(/ entries\).*/, "", s)
                entries = s + 0
                unclaimed = 0
                in_file = 1
                next
              }
              in_file && /unclaimed:/ {
                # Extract the unclaimed number.
                s = $0
                sub(/.*unclaimed: */, "", s)
                sub(/ .*/, "", s)
                unclaimed = s + 0
                claimed = entries - unclaimed
                pct = (entries > 0) ? int(claimed * 100 / entries) : 0
                printf "| `%s` | %d | %d (%d%%) | %d | -- |\n", fname, entries, claimed, pct, unclaimed
                in_file = 0
              }
              /^===/ { in_file = 0 }
            ' /tmp/smoke-output.txt

            echo ""

            # Include ratchet report section.
            if [ "${{ steps.smoke.outputs.has_ratchet }}" = "true" ]; then
              echo "### Ratchet Comparison"
              echo ""
              echo '```'
              sed -n '/^Ratchet/,/^$/p' /tmp/smoke-output.txt
              echo '```'
            else
              echo "### Ratchet Comparison"
              echo ""
              echo "_No baseline comparison performed._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Auto-update baseline when improvements are detected on main.
      - name: Check for baseline improvements
        if: >-
          steps.smoke.outcome == 'success' &&
          steps.smoke.outputs.has_ratchet == 'true' &&
          github.ref == 'refs/heads/main'
        id: baseline-check
        run: |
          if grep -q '\[+\]' /tmp/smoke-output.txt; then
            echo "has_improvements=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_improvements=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update baseline and open PR
        if: >-
          steps.baseline-check.outcome == 'success' &&
          steps.baseline-check.outputs.has_improvements == 'true'
        env:
          MANASIGHT_TEST_LOGS: /tmp/test-logs/corpus
          CORPUS_TAG: ${{ steps.corpus-tag.outputs.tag }}
          SMOKE_BLESS: "1"
          # Use a PAT so the resulting pull_request event triggers CI workflows.
          # The default GITHUB_TOKEN suppresses downstream workflow triggers.
          GH_TOKEN: ${{ secrets.BASELINE_PR_TOKEN }}
        run: |
          # Re-run in bless mode to write updated baseline.
          if ! cargo test smoke_test_real_logs > /dev/null 2>&1; then
            echo "::warning::Bless mode run exited non-zero — baseline may not have been updated"
          fi

          # Check if baseline actually changed.
          if git diff --quiet smoke-baseline.json; then
            echo "Baseline unchanged after bless — nothing to do."
            exit 0
          fi

          # Configure git identity for the commit (actions/checkout does not set these).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Put the PAT in the remote URL so git push authenticates with it.
          # This only works because checkout runs with persist-credentials:
          # false; a persisted extraheader would take precedence.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          BRANCH="auto/update-smoke-baseline-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add smoke-baseline.json
          git commit -m "chore: auto-update smoke-baseline.json

          Smoke test detected improved parser counts on main.
          This baseline update ratchets forward to the new counts.

          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          git push -u origin "$BRANCH"

          gh pr create \
            --base main \
            --title "chore: auto-update smoke test baseline" \
            --body "$(cat <<'EOF'
          ## Summary
          Smoke test CI detected improved parser counts on main.
          This PR updates `smoke-baseline.json` to ratchet forward to the new counts.

          Auto-generated by the smoke test workflow.
          EOF
          )"

      - name: Write skip summary
        if: steps.secrets-check.outputs.skip == 'true'
        run: |
          {
            echo "## Smoke Test -- Skipped"
            echo ""
            echo "TEST_DATA_TOKEN is not available to this run."
            echo "This is expected for fork and Dependabot pull requests."
          } >> "$GITHUB_STEP_SUMMARY"
