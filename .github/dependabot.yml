version: 2
updates:
  # Version updates are disabled (limit 0); dependency updates are batched
  # outside Dependabot. Security updates, when enabled in the repository
  # settings, are not governed by this limit.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Patch and minor bumps land in one PR; a major bump falls outside
      # `update-types` here, so it never matches this group and always gets
      # its own PR.
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
